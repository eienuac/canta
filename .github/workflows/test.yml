name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throw-away PostgreSQL that exists only for this job. No repository or
    # organization secrets are used, so the tests can never reach Supabase /
    # production (tests/helpers/pg.ts also refuses any non-local host).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/canta_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npm test
